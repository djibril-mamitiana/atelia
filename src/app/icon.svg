<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Same mark as the header logo (components/layout/logo.tsx), drawn a
       little bolder so it stays readable at 16 px; white on dark tab bars. -->
  <style>
    .m { color: #0d0f12; }
    @media (prefers-color-scheme: dark) { .m { color: #ffffff; } }
  </style>
  <g class="m">
    <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2" />
    <g fill="currentColor">
      <rect x="14.75" y="1.5" width="2.5" height="5" rx="0.7" />
      <rect x="14.75" y="1.5" width="2.5" height="5" rx="0.7" transform="rotate(30 16 16)" />
      <rect x="14.75" y="1.5" width="2.5" height="5" rx="0.7" transform="rotate(60 16 16)" />
      <rect x="14.75" y="1.5" width="2.5" height="5" rx="0.7" transform="rotate(90 16 16)" />
      <rect x="14.75" y="1.5" width="2.5" height="5" rx="0.7" transform="rotate(120 16 16)" />
      <rect x="14.75" y="1.5" width="2.5" height="5" rx="0.7" transform="rotate(150 16 16)" />
      <rect x="14.75" y="1.5" width="2.5" height="5" rx="0.7" transform="rotate(180 16 16)" />
      <rect x="14.75" y="1.5" width="2.5" height="5" rx="0.7" transform="rotate(210 16 16)" />
      <rect x="14.75" y="1.5" width="2.5" height="5" rx="0.7" transform="rotate(240 16 16)" />
      <rect x="14.75" y="1.5" width="2.5" height="5" rx="0.7" transform="rotate(270 16 16)" />
      <rect x="14.75" y="1.5" width="2.5" height="5" rx="0.7" transform="rotate(300 16 16)" />
      <rect x="14.75" y="1.5" width="2.5" height="5" rx="0.7" transform="rotate(330 16 16)" />
    </g>
  </g>
  <circle cx="16" cy="16" r="5" fill="#ff5a1f" />
</svg>
